# Workspace root — not itself a published package. Members live in
# packages/* (devkit, skill-catalog).

[project]
name = "devin-devkit-workspace"
version = "0.0.0"
description = "Monorepo workspace for the devin-devkit product: devkit, skill-catalog."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
