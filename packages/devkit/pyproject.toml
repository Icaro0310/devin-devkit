[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-devkit"
version = "0.1.0"
description = "Install public Devin CLI profiles through uv"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2"]

[project.scripts]
devin-devkit = "devin_devkit.cli:main"
devin-devkit-mcp = "devin_devkit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devin_devkit = ["manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
