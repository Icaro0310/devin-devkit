[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-skill-catalog"
version = "0.1.0"
description = "Inventory, lint, quarantine and promote Devin skills and rules — with per-workspace diff and offline G1/G2 gates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2"]

[project.scripts]
devin-skill-catalog = "devin_skill_catalog.cli:main"
devin-skill-catalog-mcp = "devin_skill_catalog.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
