name: publish

# Publishes the package matching the pushed tag (or the selected dispatch
# input) to PyPI via Trusted Publishing (OIDC). The upload job must live in
# this file: PyPI matches job_workflow_ref against this workflow's path.

on:
  push:
    tags: ['devkit-v*','skill-catalog-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - devkit
          - skill-catalog

permissions:
  contents: read

jobs:
  # Wheel __version__ gate lives in one place — verified before publish runs.
  # Scoped to the package this run is releasing (tag or dispatch input);
  # a mismatch in the other package must not block this release.
  verify:
    uses: Icaro0310/devin-powerups/.github/workflows/verify-wheel-version.yml@61bf0b6bf9d726a8b7b5217556e0f6ed432fbc62 # v1
    with:
      package-dir: ${{ (inputs.package == 'devkit' || startsWith(github.ref_name, 'devkit-v')) && 'packages/devkit' || 'packages/skill-catalog' }}
      module: ${{ (inputs.package == 'devkit' || startsWith(github.ref_name, 'devkit-v')) && 'devin_devkit' || 'devin_skill_catalog' }}
      python-version: "3.12"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ (inputs.package == 'devkit' || startsWith(github.ref_name, 'devkit-v')) && 'pypi-devkit' || 'pypi-skill-catalog' }}
    permissions:
      id-token: write
      contents: read
    steps:
      # Ship the exact dist/ that passed the verify gate — no second build.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      # Supply-chain guard: wheels once reached PyPI via dispatch from
      # unmerged branches elsewhere in the ecosystem. Refuse to upload
      # when the publish origin is not merged.
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # No password: a set token disables Trusted Publishing (OIDC)
          # and triggers PyPI warning emails. Secret kept in repo as
          # dormant rollback only — it is never passed.
          packages-dir: dist
          skip-existing: true
