name: ci

# Secrets scan runs on every change; per-package test jobs are gated on
# the `changes` diff (job-level path gating, replacing the path-filtered
# test-*.yml PR triggers). The always-on `ci-gate` job aggregates every
# result into the single required check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      devkit: ${{ steps.f.outputs.devkit }}
      skill_catalog: ${{ steps.f.outputs.skill_catalog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git rev-parse --verify "$base" >/dev/null 2>&1; then
            base="HEAD~1"
          fi
          diff_ok=0
          git diff --name-only "$base" HEAD >/dev/null 2>&1 && diff_ok=1
          # diff not computable -> run every suite (safe default)
          for spec in \
            'devkit:packages/devkit/** .github/workflows/test-devkit.yml' \
            'skill_catalog:packages/skill-catalog/** .github/workflows/test-skill-catalog.yml' \
          ; do
            pkg="${spec%%:*}"; paths="${spec#*:}"
            if [ "$diff_ok" = "0" ] || git diff --name-only "$base" HEAD -- $paths | grep -q .; then
              echo "$pkg=true" >> "$GITHUB_OUTPUT"
            else
              echo "$pkg=false" >> "$GITHUB_OUTPUT"
            fi
          done
  secrets-scan:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/secrets-scan.yml@v1
  adapters-check:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/adapters-check.yml@v1
  config-restricted-check:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/config-restricted-check.yml@v1
  test-devkit:
    needs: changes
    if: needs.changes.outputs.devkit == 'true'
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/python-test.yml@v1
    with:
      package-dir: packages/devkit
  test-skill-catalog:
    needs: changes
    if: needs.changes.outputs.skill_catalog == 'true'
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/python-test.yml@v1
    with:
      package-dir: packages/skill-catalog
  ci-gate:
    if: always()
    needs: [changes, secrets-scan, adapters-check, config-restricted-check, test-devkit, test-skill-catalog]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items()
                 if v["result"] not in ("success", "skipped")}
          for k, v in needs.items():
              print(f"{k}: {v['result']}")
          if bad:
              print(f"ci-gate FAIL: {bad}", file=sys.stderr)
              sys.exit(1)
          print("ci-gate PASS")
          PY
